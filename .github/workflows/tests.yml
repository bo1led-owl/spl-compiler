name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # Add grammar versions you have implemented (e.g. [1, 2, 3, 4, 5])
        grammar: [1]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test harness dependency
        run: pip install pytest

      - uses: https://codeberg.org/mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: Build your compiler
        run: zig build --release=fast -p build/

      - name: Run tests for grammar ${{ matrix.grammar }}
        run: python3 test/run_tests.py test --grammar ${{ matrix.grammar }} --no-build